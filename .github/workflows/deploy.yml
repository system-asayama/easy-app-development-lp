name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (production)
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST_PRODUCTION }}
          username: ${{ secrets.SSH_USER_PRODUCTION }}
          port: ${{ secrets.SSH_PORT_PRODUCTION }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: GITHUB_TOKEN
          script: |
            PREV_SHA="$(cd ~/apps/easy-app-development-lp 2>/dev/null && git rev-parse HEAD 2>/dev/null || true)" && echo "[DEBUG] target_dir=~/apps/easy-app-development-lp" && echo "[DEBUG] full_name=system-asayama/easy-app-development-lp" && echo "[DEBUG] branch=main" && echo "[DEBUG] deploy_mode=docker" && echo "[DEBUG] hostname=$(hostname)" && echo "[DEBUG] whoami=$(whoami)" && echo "[DEBUG] git --version: $(git --version 2>&1)" && echo "[DEBUG] docker --version: $(docker --version 2>&1)" && echo "[DEBUG] docker compose version: $(docker compose version 2>&1)" && echo "[DEBUG] dir exists? $(test -d ~/apps/easy-app-development-lp && echo YES || echo NO)" && echo "[DEBUG] .git exists? $(test -d ~/apps/easy-app-development-lp/.git && echo YES || echo NO)" && if [ -d ~/apps/easy-app-development-lp/.git ]; then echo "[DEBUG] taking git pull path" && cd ~/apps/easy-app-development-lp && git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/system-asayama/easy-app-development-lp.git && echo "[DEBUG] git remote URL updated" && git fetch origin main && echo "[DEBUG] git fetch origin main OK" && git checkout -B main origin/main && echo "[DEBUG] checkout & reset to origin/main OK" && echo "[DEBUG] git pull OK"; else echo "[DEBUG] taking git clone path" && mkdir -p "$(dirname ~/apps/easy-app-development-lp)" && rm -rf ~/apps/easy-app-development-lp && git clone --branch main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/system-asayama/easy-app-development-lp.git ~/apps/easy-app-development-lp && echo "[DEBUG] git clone OK"; fi && echo "[DEBUG] post-pull, ls ~/apps/easy-app-development-lp:" && ls -la ~/apps/easy-app-development-lp | head -20 && cd ~/apps/easy-app-development-lp && echo "[DEBUG] building easy_app_development_lp image with --no-cache --pull..." && docker build --pull --no-cache -t easy_app_development_lp:latest . && (docker stop easy_app_development_lp 2>/dev/null || true) && (docker rm easy_app_development_lp 2>/dev/null || true) && CONTAINER_PORT=$(grep -iE "^EXPOSE [0-9]+" Dockerfile 2>/dev/null | head -1 | awk '{print $2}' | grep -oE "[0-9]+" | head -1); if [ -z "$CONTAINER_PORT" ]; then if grep -qiE "^FROM[[:space:]]+([^[:space:]]+[/:])?nginx" Dockerfile 2>/dev/null; then CONTAINER_PORT=80; else CONTAINER_PORT=8000; fi; fi; echo "[DEBUG] detected CONTAINER_PORT=$CONTAINER_PORT (HOST 8089 → CONTAINER $CONTAINER_PORT)" && docker run -d --name easy_app_development_lp --restart unless-stopped -p 8089:$CONTAINER_PORT easy_app_development_lp:latest && ( if ! command -v curl >/dev/null 2>&1; then echo "[DEPLOY] curl が無いためヘルスチェックをスキップ"; exit 0; fi; echo "[DEPLOY] ヘルスチェック http://127.0.0.1:8089/ ..."; HC=000; for i in 1 2 3 4 5 6; do sleep 5; HC=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:8089/ 2>/dev/null || echo 000); echo "[DEPLOY] try $i: HTTP $HC"; case "$HC" in 2*|3*|4*) break;; esac; done; case "$HC" in 2*|3*|4*) echo "[DEPLOY] OK 正常応答 (HTTP $HC)";; *) echo "[DEPLOY] NG 異常 (HTTP $HC)。直前のコミットへロールバックします。"; if [ -n "$PREV_SHA" ]; then cd ~/apps/easy-app-development-lp && git checkout -B main "$PREV_SHA" && cd ~/apps/easy-app-development-lp && docker build --pull --no-cache -t easy_app_development_lp:latest . && (docker stop easy_app_development_lp 2>/dev/null || true) && (docker rm easy_app_development_lp 2>/dev/null || true) && CONTAINER_PORT=$(grep -iE "^EXPOSE [0-9]+" Dockerfile 2>/dev/null | head -1 | awk '{print $2}' | grep -oE "[0-9]+" | head -1); if [ -z "$CONTAINER_PORT" ]; then if grep -qiE "^FROM[[:space:]]+([^[:space:]]+[/:])?nginx" Dockerfile 2>/dev/null; then CONTAINER_PORT=80; else CONTAINER_PORT=8000; fi; fi; echo "[DEBUG] detected CONTAINER_PORT=$CONTAINER_PORT (HOST 8089 → CONTAINER $CONTAINER_PORT)" && docker run -d --name easy_app_development_lp --restart unless-stopped -p 8089:$CONTAINER_PORT easy_app_development_lp:latest && echo "[DEPLOY] rolled back to $PREV_SHA"; else echo "[DEPLOY] 初回デプロイのため戻す先がありません"; fi; exit 1;; esac )
